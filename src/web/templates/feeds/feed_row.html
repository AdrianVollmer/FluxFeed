<div class="card hover:shadow-lg transition max-w-full" id="feed-{{ feed.id }}">
    <div class="flex justify-between items-start gap-2">
        <div class="flex-1 min-w-0">
            <h3 class="text-xl font-semibold mb-2">
                <a href="/feeds/{{ feed.id }}"
                   class="block overflow-hidden whitespace-nowrap hover:text-blue-600 dark:hover:text-blue-400 [mask-image:linear-gradient(to_right,black_90%,transparent_100%)] [-webkit-mask-image:linear-gradient(to_right,black_90%,transparent_100%)]">
                    {{ feed.title }}
                </a>
            </h3>

            {% if feed.description.is_some() %}
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">
                {{ feed.description.as_ref().unwrap() }}
            </p>
            {% endif %}

            <div class="flex items-center gap-4 text-sm text-gray-500 dark:text-gray-500 min-w-0">
                <span class="flex items-center min-w-0">
                    {% include "icons/link.html" %}
                    <a href="{{ feed.url }}" target="_blank" class="hover:underline truncate min-w-0">
                        {{ feed.url }}
                    </a>
                </span>

                {% if feed.site_url.is_some() %}
                <span class="flex items-center flex-shrink-0">
                    {% include "icons/globe.html" %}
                    <a href="{{ feed.site_url.as_ref().unwrap() }}" target="_blank" class="hover:underline">
                        Site
                    </a>
                </span>
                {% endif %}
            </div>
        </div>

        <div class="flex items-center gap-3 flex-shrink-0 ml-4">
            <a href="/articles?feed_ids={{ feed.id }}"
               title="View articles"
               class="text-gray-500 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400">
                {% include "icons/eye.html" %}
            </a>
            <button
                hx-delete="/feeds/{{ feed.id }}"
                hx-confirm="Are you sure you want to delete this feed and all its articles?"
                hx-target="#feed-{{ feed.id }}"
                hx-swap="outerHTML swap:1s"
                title="Delete feed"
                class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300">
                {% include "icons/trash.html" %}
            </button>
        </div>
    </div>
</div>
